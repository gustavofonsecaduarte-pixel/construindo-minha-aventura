<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Em Busca da Cidade Perdida de Krato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header>
      <h1>Em Busca da Cidade Perdida de Krato</h1>
      <div id="inventory-display" class="inventory">
        <span>Inventário: </span><span id="inventory-list">Vazio</span>
      </div>
    </header>

    <main>
      <div id="story-card" class="card">
        <h2 id="node-title">Início da Jornada</h2>
        <p id="story-text">Carregando história...</p>
        <div id="options-container" class="options"></div>
      </div>
    </main>

    <footer>
      <button id="restart-btn" class="restart-btn hidden">Jogar Novamente</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
